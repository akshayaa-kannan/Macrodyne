<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" type="image/jpeg" href="icon.jpeg">
<title>Macrodyne Secure Login</title>

<!-- Google Identity -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
:root{
    --primary:#0b4ea2;
    --primary-dark:#062e63;
    --accent:#f7b500;
    --steel:#dbe3ef;
    --bg:#0b1c33;
}

*{
    box-sizing:border-box;
    font-family:"Segoe UI", Arial, sans-serif;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(135deg, #0b1c33 0%, #0b4ea2 100%);
    overflow:hidden;
}

/* subtle industrial grid */
.bg-overlay{
    position:absolute;
    inset:0;
    background:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
}

/* ===========================
   LOGIN CARD – PREMIUM
=========================== */

.login-card{
    position:relative;
    background:
        linear-gradient(180deg, #ffffff 0%, #f2f6fb 100%);
    width:100%;
    max-width:440px;
    padding:46px 40px 40px;
    border-radius:20px;

    box-shadow:
        0 35px 80px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.9);

    border:1px solid rgba(11,78,162,.15);
    overflow:hidden;
    animation:cardReveal .9s ease;
}

/* TOP ACCENT STRIP */
.card-accent{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:6px;
    background:
        linear-gradient(90deg,
            #f7b500,
            #0b4ea2,
            #062e63);
}

/* INNER FRAME */
.login-card::after{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:14px;
    border:1px solid rgba(11,78,162,.08);
    pointer-events:none;
}

/* SECURE BADGE */
.login-card::before{
    content:"🔒 SECURE LOGIN";
    position:absolute;
    top:14px;
    right:16px;
    background:rgba(11,78,162,.1);
    color:#0b4ea2;
    font-size:11px;
    padding:6px 12px;
    border-radius:10px;
    font-weight:700;
    letter-spacing:.6px;
}

/* LOGO AREA */
.logo{
    margin-bottom:22px;
}

.logo img{
    height:52px;
}

.tagline{
    font-size:11px;
    letter-spacing:1.5px;
    color:#555;
    text-transform:uppercase;
    margin-top:6px;
}

/* HEADINGS */
h2{
    color:#062e63;
    font-size:22px;
    margin-bottom:6px;
    font-weight:700;
}

.subtitle{
    font-size:14px;
    color:#555;
    margin-bottom:32px;
}

/* GOOGLE BUTTON AREA */
.g_id_signin{
    display:flex;
    justify-content:center;
    padding:14px;
    background:rgba(11,78,162,.04);
    border-radius:14px;
    border:1px dashed rgba(11,78,162,.2);
}

/* FOOTER */
.footer{
    margin-top:30px;
    padding-top:14px;
    font-size:12px;
    color:#666;
    border-top:1px solid #e5e9f0;
}

/* HOVER LIFT */
.login-card:hover{
    transform:translateY(-3px);
    transition:.35s ease;
}

/* ANIMATION */
@keyframes cardReveal{
    from{
        opacity:0;
        transform:translateY(30px) scale(.97);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

</style>
</head>

<body>

<div class="login-card">
    <div class="card-accent"></div>

    <div class="logo">
        <img src="logo.png" alt="Macrodyne">
    </div>

    <h2>Authorized Access Only</h2>
    <div class="subtitle">
        Sign in using an approved company email
    </div>

    <!-- GOOGLE LOGIN -->
    <div id="g_id_onload"
         data-client_id="650472599106-dd4qejp9k8dda4tn4n5tfn54ejg922kc.apps.googleusercontent.com"
         data-callback="handleLogin">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-size="large"
         data-theme="outline">
    </div>

    <div class="footer">
        © 2025 Macrodyne Presses & Automation
    </div>

</div>

<script>
function handleLogin(response){
    const user = JSON.parse(atob(response.credential.split('.')[1]));
    const email = user.email;

    // 🔒 WHITELIST (ONLY THESE EMAILS CAN LOGIN)
    const whitelist = [
        "manikandang6002@gmail.com",
        "nayaruvi.official@gmail.com",
        "manojkumar2742007@gmail.com",
        "quality.engineer@macrodyne.com",
        "design@macrodyne.com",
        "admin@macrodyne.com"
    ];

    if(whitelist.includes(email)){
        localStorage.setItem("macrodyne_auth","true");
        localStorage.setItem("macrodyne_user", email);
        window.location.href = "dashboard.html";
    }else{
        alert("Access Denied. You are not an authorized user.");
    }
}
</script>

</body>
</html>
